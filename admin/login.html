<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Admin Login — Aditya's Portfolio CMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#050505;--bg2:#0a0d0a;
  --sf:#0f120f;--sf2:#141814;
  --hi:#f0f5f1;--md:#b8c4ba;--lo:#7a887c;--xs:#4a564c;
  --ac:#34d36e;--ac-h:#22c55e;--ac-dim:rgba(52,211,110,.10);
  --br:rgba(52,211,110,.13);--br2:rgba(255,255,255,.06);
  --r:16px;--rp:999px;
  --sh:0 2px 8px rgba(0,0,0,.5),0 12px 32px rgba(0,0,0,.4);
  --font:'Inter',sans-serif;
}
[data-theme="light"]{
  --bg:#f7fafc;--bg2:#edf2f6;
  --sf:#ffffff;--sf2:#f0f4f7;
  --hi:#111111;--md:#3c4349;--lo:#5f6670;--xs:#8a929b;
  --ac:#22a355;--ac-h:#16803c;--ac-dim:rgba(34,163,85,.10);
  --br:rgba(34,163,85,.18);--br2:rgba(0,0,0,.06);
  --sh:0 2px 8px rgba(0,0,0,.08),0 12px 32px rgba(0,0,0,.06);
}
body{font-family:var(--font);background:var(--bg);color:var(--md);min-height:100vh;display:grid;place-items:center;padding:24px;}
.login-wrap{width:100%;max-width:420px;}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo-icon{width:52px;height:52px;background:var(--ac-dim);border:1px solid var(--br);border-radius:14px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px;}
.login-logo-icon svg{width:26px;height:26px;stroke:var(--ac);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.login-logo h1{font-size:22px;font-weight:700;color:var(--hi);letter-spacing:-.3px;}
.login-logo p{font-size:13px;color:var(--lo);margin-top:4px;}
.login-card{background:var(--sf);border:1px solid var(--br2);border-radius:var(--r);padding:32px;box-shadow:var(--sh);}
.form-group{margin-bottom:20px;}
.form-group label{display:block;font-size:13px;font-weight:500;color:var(--md);margin-bottom:7px;}
.input-wrap{position:relative;}
.input-wrap input{width:100%;background:var(--sf2);border:1px solid var(--br2);border-radius:10px;padding:11px 14px;font-size:14px;color:var(--hi);font-family:var(--font);outline:none;transition:.18s border-color,.18s box-shadow;}
.input-wrap input:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-dim);}
.input-wrap input::placeholder{color:var(--xs);}
.pw-wrap input{padding-right:42px;}
.pw-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--lo);padding:4px;display:flex;align-items:center;justify-content:center;transition:color .15s;}
.pw-toggle:hover{color:var(--md);}
.pw-toggle svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.form-footer{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;color:var(--lo);}
.remember input[type="checkbox"]{accent-color:var(--ac);width:15px;height:15px;cursor:pointer;}
.login-btn{width:100%;background:var(--ac);color:#030d07;border:none;border-radius:10px;padding:12px;font-size:14px;font-weight:600;font-family:var(--font);cursor:pointer;transition:.18s background,.18s transform,.18s box-shadow;display:flex;align-items:center;justify-content:center;gap:8px;}
.login-btn:hover:not(:disabled){background:var(--ac-h);transform:translateY(-1px);box-shadow:0 4px 16px rgba(52,211,110,.25);}
.login-btn:active:not(:disabled){transform:translateY(0);}
.login-btn:disabled{opacity:.6;cursor:not-allowed;}
.login-btn .spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.2);border-top-color:#030d07;border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:11px 14px;font-size:13px;color:#f87171;margin-bottom:18px;display:none;}
.error-box.show{display:block;}
.theme-toggle-wrap{text-align:center;margin-top:20px;}
.theme-toggle-wrap button{background:none;border:none;color:var(--lo);font-size:12px;cursor:pointer;font-family:var(--font);transition:color .15s;}
.theme-toggle-wrap button:hover{color:var(--md);}
@media(max-width:440px){.login-card{padding:24px 20px;}}
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="login-logo-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </div>
    <h1>Portfolio CMS</h1>
    <p>Sign in to manage your portfolio</p>
  </div>

  <div class="login-card">
    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="emailInput">Email address</label>
        <div class="input-wrap">
          <input type="email" id="emailInput" placeholder="admin@portfolio.local" autocomplete="email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="passwordInput">Password</label>
        <div class="input-wrap pw-wrap">
          <input type="password" id="passwordInput" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="pw-toggle" id="pwToggle" aria-label="Toggle password visibility">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="form-footer">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          Remember me
        </label>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span id="btnText">Sign In</span>
      </button>
    </form>
  </div>

  <div class="theme-toggle-wrap">
    <button id="themeToggle">Switch to light mode</button>
  </div>
</div>

<script>
// Theme toggle
const html = document.documentElement;
const saved = localStorage.getItem('admin-theme') || 'dark';
html.setAttribute('data-theme', saved);
const tBtn = document.getElementById('themeToggle');
function updateThemeBtn() {
  const isDark = html.getAttribute('data-theme') === 'dark';
  tBtn.textContent = isDark ? 'Switch to light mode' : 'Switch to dark mode';
}
updateThemeBtn();
tBtn.addEventListener('click', () => {
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('admin-theme', next);
  updateThemeBtn();
});

// Password toggle
const pwInput = document.getElementById('passwordInput');
const pwToggle = document.getElementById('pwToggle');
const eyeIcon = document.getElementById('eyeIcon');
pwToggle.addEventListener('click', () => {
  const show = pwInput.type === 'password';
  pwInput.type = show ? 'text' : 'password';
  eyeIcon.innerHTML = show
    ? '<line x1="1" y1="1" x2="23" y2="23"/><path d="M9.88 9.88a3 3 0 104.24 4.24"/><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 01-4.24-4.24"/>'
    : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
});

// Login form
const form = document.getElementById('loginForm');
const loginBtn = document.getElementById('loginBtn');
const btnText = document.getElementById('btnText');
const errorBox = document.getElementById('errorBox');

function showError(msg) {
  errorBox.textContent = msg;
  errorBox.classList.add('show');
}
function hideError() { errorBox.classList.remove('show'); }
function setLoading(on) {
  loginBtn.disabled = on;
  btnText.innerHTML = on ? '<span class="spinner"></span> Signing in…' : 'Sign In';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  hideError();
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  if (!email || !password) { showError('Please enter your email and password.'); return; }
  setLoading(true);
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (data.success) {
      window.location.href = '/admin/';
    } else {
      showError(data.error || 'Login failed. Please try again.');
    }
  } catch (err) {
    showError('Connection error. Please check if the server is running.');
  } finally {
    setLoading(false);
  }
});
</script>
</body>
</html>
