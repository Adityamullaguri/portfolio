<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="certBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="560" fill="url(#certBg)"/>
  
  <!-- Outer Decorative Border -->
  <rect x="20" y="20" width="760" height="520" rx="16" fill="none" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="28" y="28" width="744" height="504" rx="12" fill="none" stroke="#4285f4" stroke-width="1.5" stroke-dasharray="8 4"/>

  <!-- Google Colorful Header Bar -->
  <path d="M 40 40 L 220 40" stroke="#4285f4" stroke-width="6" stroke-linecap="round"/>
  <path d="M 230 40 L 410 40" stroke="#ea4335" stroke-width="6" stroke-linecap="round"/>
  <path d="M 420 40 L 600 40" stroke="#fbbc05" stroke-width="6" stroke-linecap="round"/>
  <path d="M 610 40 L 760 40" stroke="#34a853" stroke-width="6" stroke-linecap="round"/>

  <!-- Logos Section -->
  <text x="60" y="90" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#1e293b">Google</text>
  <text x="690" y="90" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="end">coursera</text>

  <!-- Main Certificate Title & Content -->
  <text x="400" y="150" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="3">COURSE CERTIFICATE OF COMPLETION</text>
  
  <text x="400" y="210" font-family="'Inter', sans-serif" font-size="15" fill="#475569" text-anchor="middle">This is to certify that</text>
  <text x="400" y="260" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">ADITYA</text>
  <line x1="250" y1="275" x2="550" y2="275" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="315" font-family="'Inter', sans-serif" font-size="15" fill="#475569" text-anchor="middle">has successfully completed</text>
  <text x="400" y="360" font-family="'Inter', sans-serif" font-size="26" font-weight="800" fill="#1d4ed8" text-anchor="middle">Crash Course on Python</text>
  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">An online non-credit course authorized by Google and offered through Coursera</text>

  <!-- Gold Seal -->
  <g transform="translate(680, 440)">
    <circle cx="0" cy="0" r="38" fill="url(#goldSeal)"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <path d="M -12 2 L -4 10 L 14 -8" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="22" font-family="'Inter', sans-serif" font-size="8" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  </g>

  <!-- Footer Metadata & Signatures -->
  <text x="60" y="470" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Issue Date: <tspan font-weight="400">August 2024</tspan></text>
  <text x="60" y="492" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Credential ID: <tspan font-weight="400">GOOG-PY-2024-8849</tspan></text>

  <line x1="420" y1="480" x2="560" y2="480" stroke="#94a3b8" stroke-width="1"/>
  <text x="490" y="498" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Google Career Certificates</text>
</svg>
