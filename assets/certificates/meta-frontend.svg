<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="metaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="metaSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <rect width="800" height="560" fill="url(#metaBg)"/>
  <rect x="20" y="20" width="760" height="520" rx="16" fill="none" stroke="#0284c7" stroke-width="2"/>
  <rect x="28" y="28" width="744" height="504" rx="12" fill="none" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Logo -->
  <text x="60" y="90" font-family="'Inter', sans-serif" font-size="24" font-weight="900" fill="#0284c7">Meta</text>
  <text x="690" y="90" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#2563eb" text-anchor="end">coursera</text>

  <!-- Title -->
  <text x="400" y="150" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#0369a1" text-anchor="middle" letter-spacing="3">PROFESSIONAL CERTIFICATE</text>
  
  <text x="400" y="210" font-family="'Inter', sans-serif" font-size="15" fill="#475569" text-anchor="middle">This is to certify that</text>
  <text x="400" y="260" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#0f172a" text-anchor="middle">ADITYA</text>
  <line x1="250" y1="275" x2="550" y2="275" stroke="#cbd5e1" stroke-width="1.5"/>

  <text x="400" y="315" font-family="'Inter', sans-serif" font-size="15" fill="#475569" text-anchor="middle">has successfully completed the 9-course online program</text>
  <text x="400" y="360" font-family="'Inter', sans-serif" font-size="25" font-weight="800" fill="#0369a1" text-anchor="middle">Front-End Developer Professional</text>
  <text x="400" y="390" font-family="'Inter', sans-serif" font-size="13" fill="#64748b" text-anchor="middle">HTML, CSS, JavaScript, React, Version Control, &amp; UX/UI Design</text>

  <!-- Seal -->
  <g transform="translate(680, 440)">
    <circle cx="0" cy="0" r="38" fill="url(#metaSeal)"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" font-family="'Inter', sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Footer -->
  <text x="60" y="470" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Issue Date: <tspan font-weight="400">December 2023</tspan></text>
  <text x="60" y="492" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#334155">Credential ID: <tspan font-weight="400">META-FE-2023-4410</tspan></text>

  <line x1="420" y1="480" x2="560" y2="480" stroke="#94a3b8" stroke-width="1"/>
  <text x="490" y="498" font-family="'Inter', sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Meta Staff Instructors</text>
</svg>
