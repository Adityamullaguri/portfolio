<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="quizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311b92"/>
      <stop offset="50%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="quizGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#quizBg)"/>
  
  <!-- Floating Quiz Cards Artwork -->
  <g transform="translate(420, 100) rotate(-4)">
    <rect width="320" height="200" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="url(#quizGlow)" stroke-width="2"/>
    <rect x="24" y="24" width="180" height="14" rx="7" fill="#a855f7"/>
    <rect x="24" y="54" width="260" height="10" rx="5" fill="rgba(255,255,255,0.4)"/>
    <rect x="24" y="74" width="220" height="10" rx="5" fill="rgba(255,255,255,0.4)"/>

    <rect x="24" y="110" width="120" height="32" rx="8" fill="rgba(168, 85, 247, 0.3)" stroke="#a855f7" stroke-width="1"/>
    <rect x="156" y="110" width="120" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  </g>
  
  <!-- Title Graphic -->
  <g transform="translate(60, 60)">
    <rect width="120" height="34" rx="17" fill="rgba(168, 85, 247, 0.25)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="60" y="22" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">AI GENERATOR</text>
  </g>
  <text x="60" y="140" font-family="'Inter', sans-serif" font-size="34" font-weight="800" fill="#ffffff">Quizer — AI Quiz App</text>
  <text x="60" y="175" font-family="'Inter', sans-serif" font-size="16" font-weight="500" fill="#94a3b8">PDF / OCR Extraction · MCQ Detection &amp; Performance Analytics</text>
</svg>
