<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="850" fill="url(#bgGrad)"/>
  
  <!-- Outer & Inner Certificate Border -->
  <rect x="30" y="30" width="1140" height="790" rx="12" fill="none" stroke="#2563eb" stroke-width="4" stroke-opacity="0.2"/>
  <rect x="45" y="45" width="1110" height="760" rx="8" fill="none" stroke="#0284c7" stroke-width="2" stroke-opacity="0.4"/>
  <rect x="52" y="52" width="1096" height="746" rx="6" fill="none" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Top Brand Logo Header -->
  <g transform="translate(540, 90)">
    <rect x="0" y="0" width="120" height="48" rx="12" fill="url(#primaryGrad)"/>
    <path d="M40 14h40v8H64v18H56V22H40V14z" fill="#ffffff"/>
    <circle cx="78" cy="18" r="3.5" fill="#00e5ff"/>
  </g>
  <text x="600" y="165" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle" letter-spacing="2">TECHCORP SOLUTIONS PVT. LTD.</text>
  <text x="600" y="188" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle" letter-spacing="1">GLOBAL SOFTWARE DIVISION · CERTIFICATE OF COMPLETION</text>

  <!-- Title -->
  <text x="600" y="275" font-family="'Georgia', serif" font-size="38" font-weight="bold" fill="#0f172a" text-anchor="middle">Certificate of Internship</text>
  <text x="600" y="315" font-family="'Inter', sans-serif" font-size="15" font-weight="500" fill="#64748b" text-anchor="middle">THIS IS PROUDLY PRESENTED TO</text>

  <!-- Recipient Name -->
  <text x="600" y="385" font-family="'Georgia', serif" font-size="48" font-weight="bold" fill="#2563eb" text-anchor="middle">ADITYA</text>
  <line x1="350" y1="410" x2="850" y2="410" stroke="url(#primaryGrad)" stroke-width="2"/>

  <!-- Body Description -->
  <text x="600" y="460" font-family="'Inter', sans-serif" font-size="17" fill="#334155" text-anchor="middle">for successfully completing the tenure as <tspan font-weight="700" fill="#0f172a">Software Development Intern</tspan></text>
  <text x="600" y="492" font-family="'Inter', sans-serif" font-size="16" fill="#475569" text-anchor="middle">at TechCorp Solutions Pvt. Ltd. from <tspan font-weight="600" fill="#1e293b">June 1, 2024</tspan> to <tspan font-weight="600" fill="#1e293b">August 31, 2024</tspan>.</text>
  
  <text x="600" y="540" font-family="'Inter', sans-serif" font-size="15" fill="#64748b" text-anchor="middle">Demonstrated outstanding competence in building RESTful APIs (Node.js/Express),</text>
  <text x="600" y="565" font-family="'Inter', sans-serif" font-size="15" fill="#64748b" text-anchor="middle">real-time React/WebSocket monitoring dashboards, and Docker deployment on AWS EC2.</text>

  <!-- Gold Seal -->
  <g transform="translate(600, 670)">
    <circle cx="0" cy="0" r="42" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="36" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="0" y="-4" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
    <text x="0" y="10" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#fef3c7" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(260, 680)">
    <line x1="-80" y1="0" x2="120" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Rajesh Sharma</text>
    <text x="20" y="42" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">VP of Engineering, TechCorp</text>
  </g>

  <g transform="translate(940, 680)">
    <line x1="-120" y1="0" x2="80" y2="0" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="-20" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#1e293b" text-anchor="middle">Dr. Aris Thorne</text>
    <text x="-20" y="42" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" text-anchor="middle">Director of Human Resources</text>
  </g>

  <!-- Bottom Verification Footer -->
  <text x="600" y="775" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Certificate ID: TC-INT-2024-8842 · Authenticity verified via TechCorp Credentials Registry</text>
</svg>
