services:
  - type: web
    name: portfolio-cms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@portfolio.local
      - key: ADMIN_PASSWORD
        value: Admin@1234
    disk:
      name: portfolio-data
      mountPath: /app/data
      sizeGB: 1

