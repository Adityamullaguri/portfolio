services:
  - type: web
    name: portfolio-cms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@portfolio.local
      - key: ADMIN_PASSWORD
        value: Admin@1234
    # Persistent disk mounted at /app/data — stores:
    #   portfolio.db  (SQLite database, all dashboard edits)
    #   uploads/      (user-uploaded images, PDFs, etc.)
    #   portfolio-state.json  (JSON snapshot for disaster recovery)
    disk:
      name: portfolio-data
      mountPath: /app/data
      sizeGB: 1
