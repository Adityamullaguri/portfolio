services:
  - type: web
    name: portfolio-cms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@portfolio.local
      - key: ADMIN_PASSWORD
        value: Admin@1234
      - key: GITHUB_OWNER
        value: Adityamullaguri
      - key: GITHUB_REPO
        value: portfolio
      - key: GITHUB_BRANCH
        value: main
      # GITHUB_TOKEN must be set manually in the Render dashboard (not here)
      # to avoid GitHub push-protection rejecting the commit.
      # Set it to a GitHub Personal Access Token with repo write permission.
    # Persistent disk (requires Render paid plan)
    disk:
      name: portfolio-data
      mountPath: /app/data
      sizeGB: 1
